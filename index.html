<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0d0f1a"/>
  <meta name="description" content="TaskFlow – Smart recurring habit & task tracker"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="TaskFlow"/>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="stylesheet" href="./style.css"/>
  <title>TaskFlow ⚡</title>
</head>
<body>

<div id="app">

  <!-- ░░ PAGE: HOME ░░ -->
  <div class="page active" id="page-home">
    <!-- Rendered by app.js → renderHome() -->
  </div>

  <!-- ░░ PAGE: ADMIN ░░ -->
  <div class="page" id="page-admin">
    <!-- Rendered by app.js → renderAdmin() -->
  </div>

  <!-- ░░ PAGE: STATS ░░ -->
  <div class="page" id="page-stats">
    <!-- Rendered by app.js → renderStats() -->
  </div>

  <!-- ░░ BOTTOM NAV ░░ -->
  <nav id="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="goTo('home')">
      <span class="nav-icon">🏠</span>
      Home
    </button>
    <button class="nav-btn" id="nav-admin" onclick="goTo('admin')">
      <span class="nav-icon">⚙️</span>
      Admin
    </button>
    <button class="nav-btn" id="nav-stats" onclick="goTo('stats')">
      <span class="nav-icon">📊</span>
      Stats
    </button>
  </nav>

  <!-- ░░ TOAST ░░ -->
  <div id="toast"></div>

</div>

<script src="./app.js"></script>
</body>
</html>
